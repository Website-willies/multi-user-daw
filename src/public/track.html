<!DOCTYPE html>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your DAW</title>
        <link rel="stylesheet" type="text/css" href="track.css">
    </head>
    <body>
        <div class="controls">
            <button id="addInstrument">Add Instrument</button>
            <button id="clearAll">Clear All</button>
            <button id="playAll">Play All</button>
            <button id="pauseAll">Pause All</button>
            <label for="bpm-input">BPM:</label>
            <input type="number" id="bpm-input" value="120" min="30" max="300" step="1">
            <label for="divisions-input">Beat Divisions:</label>
            <input type="number" id="divisions-input" value="2" min="1" max="32" step="1">
            <label for="row-count-input">Column Count:</label>
            <input type="number" id="row-count-input" value="4" min="1" max="24" step="1">
        </div>
        <div id="tracks"></div>
        <div class="modal" id="instrument-modal">
            <div class="modal-content">
                <h2>Select Instrument</h2>
                <div class="instrument-list">
                    <!-- <button class="instrument-btn" data-instrument="sample" data-color="#ff6b6b">sample</button> -->
                    <button class="cancel-btn" id="cancelBtn">Cancel</button>
                </div>
            </div>
        </div>
    </body>
    <footer>
        <div id="uuid-display"></div>
    </footer>
    <script type="module" src="track.js"></script>

    <script type="module">
        let uuidDiv = document.getElementById("uuid-display");
        let button = document.getElementById("back");

        if (document.cookie === ""){
        fetch('/assign').then((response) => {

                response.json().then((body) => {

                    console.log(body);
                    document.cookie = body.uuid;
                    uuidDiv.textContent = `Session ID: ${body.uuid}`;
                        
                }).catch(error => {
                    // will be executed if attempt
                    // to parse body as JSON crashes
                    console.log(error)
                });

        }).catch(error => {
            // will be executed if first promise crashes
            console.log(error)
        });
        } else {
        let uuid = document.cookie;
        uuidDiv.textContent = `Session ID: ${uuid}`;
        }

    </script>
</html>
