<!DOCTYPE html>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<html>
<head>
  <meta charset="utf-8">
  <title>MultiUserDaw</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    p1 {
      font-size: 24px;
      display: block;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <p1>MultiUserDaw</p1>
  <div id="session-list"></div>
  <button id="daw" type="button">Start a session!</button> 

</body>

<script>
  const sessionsList = document.getElementById("session-list");
  const cookies = document.cookie 
    ? Object.fromEntries(document.cookie.split('; ').map(x => x.split('=')))
    : {};

  console.log(cookies)
  if (cookies) {
    try {

      for (const [key, val] of Object.entries(cookies)) {
        const temp = document.createElement("button");
        temp.textContent = key;
        temp.addEventListener("click", () => {
          window.location.replace(`/track.html?uuid=${val}`);
        })
        sessionsList.appendChild(temp);
      }

    } catch {
      sessionsList.textContent = "Error reading session data.";
    }
  } else {
    sessionsList.textContent = "No previous sessions.";
  }

  document.getElementById("daw").addEventListener("click", () => {
    let uuid;
    const name = prompt("Enter a name for this track:");
    if (!name){
        alert("Please enter a name.")
        return;
    };
    if (name.includes("=")){
        alert("Equals sign not permitted in track name.")
        return;
    }; 
    if (name in cookies){
        if(confirm('A track already exists by that name. Overwrite?')){} else { return; }
    }

    fetch('/assign').then((response) => {
        response.json().then((body) => {
            uuid = body.uuid
            cookies[name] = uuid
            for (const [k, v] of Object.entries(cookies)) { document.cookie = `${k}=${v};`; }
            saveTrack(uuid)
        }).catch(error => {
            console.log(error) // parse error
        });
    }).catch(error => {
        console.log(error) // fetch error
    });
    window.location.replace(`/track.html?uuid=${uuid}`);
  });
</script>
</html>
