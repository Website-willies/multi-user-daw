<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MultiUserDaw</title>
</head>
<body>

  <div id="uuid-display"></div>
  <button id="back" type="button">Back</button> 

  <script type="module">

    let uuid = document.cookie;
    let uuidDiv = document.getElementById("uuid-display");
    let button = document.getElementById("back");
    
    uuidDiv.textContent = `Session ID: ${uuid}`;

    button.addEventListener("click", () => {
      window.location.replace(`/`);
    });
  
</script>
</html>
